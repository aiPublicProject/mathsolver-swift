name: smoke (real API)
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_MODEL: ${{ secrets.SMOKE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secret
        run: |
          if [ -z "$SMOKE_API_KEY" ]; then
            echo "::error::SMOKE_API_KEY secret not configured (repo/org Settings - Secrets - Actions)"
            exit 1
          fi
      - uses: swift-actions/setup-swift@v2
        with: { "swift-version": "5.9" }
      - run: swift test --filter testSmokeRealAPI
