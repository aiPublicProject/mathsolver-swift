name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.1.2 (direct from swift.org)
        run: |
          curl -fsSL -o /tmp/swift.tar.gz "https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz"
          sudo mkdir -p /opt/swift && sudo tar -xzf /tmp/swift.tar.gz -C /opt/swift
          echo "/opt/swift/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - run: swift --version
      - run: swift test
