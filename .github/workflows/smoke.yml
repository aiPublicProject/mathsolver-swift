name: smoke (real API)
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_MODEL: ${{ secrets.SMOKE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secret
        run: |
          if [ -z "$SMOKE_API_KEY" ]; then
            echo "::error::SMOKE_API_KEY secret not configured (repo/org Settings - Secrets - Actions)"
            exit 1
          fi
      - name: Install Swift 6.1.2 (direct from swift.org)
        run: |
          curl -fsSL -o /tmp/swift.tar.gz "https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz"
          sudo mkdir -p /opt/swift && sudo tar -xzf /tmp/swift.tar.gz -C /opt/swift
          echo "/opt/swift/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - run: swift --version
      - run: swift test --filter testSmokeRealAPI
